<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>코리아시브 — 대한민국을 문명 지도로</title>
  <meta name="description" content="공개 통계로 그린 대한민국의 헥스 지도. 인구, 지역내총생산, 발전소, 공항, 세계유산.">
  <meta name="theme-color" content="#e8f7ff">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://scientifik.ai/koreaciv/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="코리아시브 — 대한민국을 문명 지도로">
  <meta property="og:description" content="시군구 통계와 지형을 문명 게임의 말로 읽어 주는 정적 지도.">
  <meta property="og:url" content="https://scientifik.ai/koreaciv/">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar">
    <button id="brand" class="brand" type="button" title="처음으로">
      <span class="seal" aria-hidden="true">韓</span>
      <span class="brand-text">
        <strong id="brand-name">대한민국</strong>
        <em id="brand-turn">2020</em>
      </span>
    </button>
    <a class="by" href="https://scientifik.ai" target="_blank" rel="noopener">by Scientifik</a>
    <div id="yields" class="yields" role="group" aria-label="산출"></div>
    <div class="spacer"></div>
    <form id="search-form" class="search" role="search">
      <input id="search" type="search" autocomplete="off" spellcheck="false" placeholder="도시 · 시군구 · 유산" aria-label="검색">
      <div id="search-list" class="search-list" hidden></div>
    </form>
    <div class="tb-actions">
      <button id="lang" class="btn" type="button">EN</button>
      <button id="about-btn" class="btn" type="button" aria-label="안내">?</button>
    </div>
  </header>

  <canvas id="map" aria-label="대한민국 헥스 지도"></canvas>
  <div id="tip" class="tip" hidden></div>

  <aside id="dock" class="dock" hidden></aside>
  <div id="about" class="modal" hidden></div>

  <div id="lensbar" class="lensbar"></div>
  <div id="legend" class="legend" hidden></div>
  <div id="key" class="key"></div>
  <canvas id="mini" class="mini" aria-label="미니맵"></canvas>
  <section id="tour" class="tour" hidden></section>

  <div id="loading">
    <div class="seal seal-lg" aria-hidden="true">韓</div>
    <p id="loading-text">국토를 살피는 중…</p>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
