<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>살모사 책 수록 동의 현황</title>
<meta name="robots" content="noindex,nofollow" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<style>
:root {
  --bg: #f3efe6; --ink: #122536; --muted: #6b7785; --line: #e6ebe8;
  --ok: #1a7f37; --wait: #c45c00; --no: #9b1c1c; --card: #fff; --lock: #eef1ee;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Apple SD Gothic Neo",Pretendard,"Malgun Gothic",sans-serif; }
.wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 64px; }
.hero { background:var(--ink); color:#fff; border-radius:18px; padding:26px 24px 20px; margin-bottom:18px; }
.hero .kicker { font-size:13px; color:#9ec9e6; }
.hero h1 { font-size:26px; margin:8px 0 12px; }
.pills { display:flex; flex-wrap:wrap; gap:6px; }
.pill { border-radius:999px; padding:5px 11px; font-size:13px; font-weight:700; color:#fff; }
.pill.ok { background:var(--ok); } .pill.wait { background:var(--wait); } .pill.no { background:var(--no); }
.hero p { font-size:13px; color:#c9d7e3; margin:12px 0 0; line-height:1.55; }
.toolbar { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 22px; }
button, .btn { appearance:none; border:0; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700; border-radius:10px; padding:9px 12px; }
.btn-primary { background:var(--ink); color:#fff; }
.btn-ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
.btn-danger { background:#fdecec; color:var(--no); }
.btn-tiny { padding:4px 8px; font-size:12px; border-radius:8px; }
.saved { font-size:12px; color:var(--muted); align-self:center; margin-left:auto; }
.section { margin:0 0 28px; }
.section-title { font-size:20px; font-weight:800; border-left:8px solid; padding-left:10px; margin:0 0 6px; }
.section.ok .section-title { border-color:var(--ok); }
.section.wait .section-title { border-color:var(--wait); }
.section.no .section-title { border-color:var(--no); }
.section-sub { font-size:13px; color:var(--muted); margin:0 0 12px 18px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:0 0 10px; }
.card-head { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.nick { font-size:16px; font-weight:800; border:0; background:transparent; width:160px; min-width:120px; flex:1; outline:none; color:var(--ink); padding:2px 0; }
.nick:focus { background:#f7faf8; border-radius:6px; padding-left:6px; }
select.status { font-family:inherit; font-size:12px; font-weight:700; border-radius:999px; padding:4px 8px; border:1px solid var(--line); }
.note { width:100%; margin-top:8px; border:1px solid #d8ddd9; border-radius:8px; font-family:inherit; font-size:13px; padding:7px 9px; color:#5c6770; background:var(--lock); cursor:default; }
.note.request { color:#1a7f37; }
.post { padding:10px 0; border-bottom:1px dashed #eee; }
.post:last-child { border-bottom:0; }
.title { width:100%; max-width:100%; box-sizing:border-box; border:0; border-bottom:1px solid #c5d4e0; background:transparent; font-family:inherit; font-size:16px; font-weight:600; color:#16324f; padding:4px 0 8px; outline:none; display:block; white-space:normal; overflow:visible; overflow-wrap:break-word; word-break:break-word; word-wrap:break-word; line-height:1.5; height:auto; min-height:0; }
.meta { display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; align-items:center; }
.meta input {
  border:1px solid #d8ddd9; border-radius:8px; font-family:inherit; font-size:12px;
  padding:5px 8px; color:#5c6770; background:var(--lock); cursor:default;
}
.meta input.date { width:118px; }
.meta input.views, .meta input.likes { width:92px; }
.meta input.link { flex:1; min-width:140px; }
.empty { color:var(--muted); font-size:13px; padding:8px 0; }
.modal-bg { position:fixed; inset:0; background:rgba(18,37,54,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:20; }
.modal-bg.show { display:flex; }
.modal { background:#fff; border-radius:16px; padding:20px; width:min(440px,100%); }
.modal h2 { margin:0 0 12px; font-size:18px; }
.modal label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; }
.modal input, .modal select { width:100%; font-family:inherit; font-size:14px; border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
.modal .row { display:flex; gap:8px; margin-top:14px; justify-content:flex-end; }
.count { font-size:13px; color:var(--muted); font-weight:600; margin-left:8px; }
.finding { color:#c45c00; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="kicker">살모사의 커피하우스 · 책 수록</div>
    <h1>글 동의 현황</h1>
    <div class="pills" id="pills"></div>
    <p>사람이나 글을 추가하면 카페에서 링크·작성일·조회수·좋아요를 찾아 채웁니다. <span style="color:#9ec9e6">목록 v22</span></p>
  </div>
  <div class="toolbar">
    <button class="btn-primary" id="addPerson">+ 사람 추가</button>
    <button class="btn-ghost" id="syncBtn">서버 목록으로 맞추기</button>
    <button class="btn-ghost" id="exportBtn">JSON 저장</button>
    <button class="btn-ghost" id="importBtn">JSON 불러오기</button>
    <input type="file" id="file" accept="application/json" hidden>
    <span class="saved" id="saved">저장됨</span>
  </div>
  <div id="app"></div>
</div>
<div class="modal-bg" id="modal">
  <div class="modal">
    <h2>사람 추가</h2>
    <label>닉네임</label>
    <input id="m-author" placeholder="예: 잠실탱크">
    <label>동의 상태</label>
    <select id="m-status">
      <option>동의완료</option>
      <option selected>답변 대기중</option>
      <option>동의불가</option>
    </select>
    <label>글 제목</label>
    <input id="m-title" placeholder="따옴표 없이 제목만">
    <label>메모 (선택)</label>
    <input id="m-note" placeholder="예: 익명처리부탁">
    <div class="row">
      <button class="btn-ghost" id="m-cancel">취소</button>
      <button class="btn-primary" id="m-ok">추가</button>
    </div>
    <div class="finding" id="m-msg" style="margin-top:10px;"></div>
  </div>
</div>
<div class="modal-bg" id="ask">
  <div class="modal">
    <h2 id="ask-msg">정말 수정하시겠습니까?</h2>
    <div class="row">
      <button class="btn-ghost" type="button" id="ask-no">취소</button>
      <button class="btn-primary" type="button" id="ask-yes">확인</button>
    </div>
  </div>
</div>

const KEY = "salmosa-consent-v2";
const LOOKUP = "http://127.0.0.1:8767/api/lookup";
const STATUSES = ["동의완료", "답변 대기중", "동의불가"];
const META = {

  "동의불가": { cls: "no", sub: "책에 넣지 않습니다." }
};
function uid(){ return "p"+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
let askResolve=null;
function askConfirm(msg){
  return new Promise(resolve=>{
    document.getElementById("ask-msg").textContent=msg;
    document.getElementById("ask").classList.add("show");
    askResolve=(v)=>{
      document.getElementById("ask").classList.remove("show");
      askResolve=null;
      resolve(!!v);
    };
  });
}
function normTitle(s){
  return String(s||"").replace(/[\s"'“”'`·.,]/g,"").toLowerCase();
}
function applySeed(p, s){
  if(!s) return;
  if (s.link && !p.link) p.link=s.link;
  if (s.id && (!p.id || String(p.id).startsWith("p"))) p.id=s.id;
  if (s.date && !p.date) p.date=s.date;
  if ((p.likes===""||p.likes==null) && s.likes!=="" && s.likes!=null) p.likes=s.likes;
  if ((p.views===""||p.views==null) && s.views!=="" && s.views!=null) p.views=s.views;
  if (!p.hangul && s.hangul) p.hangul=s.hangul;
  if (!p.title && s.title) p.title=s.title;
  if (s.note && !p.note) p.note=s.note;
  if (!s.note && /카페 닉|닉네임 카페|카페 원문/.test(p.note||"")) p.note="";
  if (s.movedAt && !(Number(p.movedAt)>0)) p.movedAt=s.movedAt;
}
function syncFromSeed(list){
  const seed = JSON.parse(JSON.stringify(SEED)).map(x => { if(!x.id) x.id=uid(); if(x.views==null) x.views=""; return x; });
  const used=new Set();
  list.forEach(p=>{
    let s = seed.find(x => (String(x.id)===String(p.id) || (p.link && x.link===p.link)) && !used.has(String(x.id)));
    if(!s){
      const nt=normTitle(p.title);
      s = seed.find(x => x.author===p.author && !used.has(String(x.id)) && (
        x.title===p.title || !nt || normTitle(x.title)===nt || normTitle(x.title).includes(nt) || nt.includes(normTitle(x.title))
      ));
    }
    if(s){ used.add(String(s.id)); applySeed(p, s); }
    if (p.views==null) p.views="";
  });
  seed.forEach(s=>{
    if (!list.some(p => p.author===s.author && (p.title===s.title || String(p.id)===String(s.id) || (p.link&&p.link===s.link)))) {
      list.push(JSON.parse(JSON.stringify(s)));
    }
  });
  return list;
}
function load(){
  const seed = JSON.parse(JSON.stringify(SEED)).map(x => { if(!x.id) x.id=uid(); if(x.views==null) x.views=""; return x; });
  try {
    const raw = localStorage.getItem(KEY) || localStorage.getItem("salmosa-consent-v1");
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) return orderRecent(syncFromSeed(parsed));
    }
  } catch(e){}
  return orderRecent(seed);
}
const PIN_TOP = {"블리치":6,"문수로":5,"구뜨":4,"구뜨(곰돌이푸우72)":4,"체육인":3,"금광천사":2,"스벅건물":1};
function orderRecent(list){
  const now=Date.now();
  list.forEach(p=>{
    if(PIN_TOP[p.author] && !(Number(p.movedAt)>0)) p.movedAt = now - 20 + PIN_TOP[p.author];
  });
  list.sort((a,b)=>(Number(b.movedAt)||0)-(Number(a.movedAt)||0));
  return list;
}
let data = load();
function save(){
  localStorage.setItem(KEY, JSON.stringify(data));
  document.getElementById("saved").textContent = "저장됨 " + new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
function setSaved(msg){ document.getElementById("saved").textContent = msg; }
async function cafeLookup(author, title){
  try {
    const u = LOOKUP + "?author=" + encodeURIComponent(author||"") + "&title=" + encodeURIComponent(title||"");
    const r = await fetch(u);
    const j = await r.json();
    if (j && j.ok) return j;
    return { ok:false, error: (j && j.error) || "못 찾음" };
  } catch(e) {
    return { ok:false, error: "자동 찾기 서버가 꺼져 있습니다. 바탕화면의 ‘살모사_책_동의현황_서버.py’를 실행해 주세요." };
  }
}
function grouped(){
  const order=[], map={};
  data.forEach((p, idx) => {
    const k=p.status+"\t"+p.author;
    if(!map[k]){ map[k]={status:p.status,author:p.author,note:p.note||"",posts:[], movedAt:0, idx}; order.push(k); }
    if(p.note && !map[k].note) map[k].note=p.note;
    map[k].posts.push(p);
    const t=Number(p.movedAt)||0;
    if(t>map[k].movedAt) map[k].movedAt=t;
  });
  return order.map(k=>map[k]);
}
function counts(){
  const people={"동의완료":new Set(),"답변 대기중":new Set(),"동의불가":new Set()};
  const posts={"동의완료":0,"답변 대기중":0,"동의불가":0};
  data.forEach(p=>{ if(people[p.status]) people[p.status].add(p.author); if(posts[p.status]!==undefined) posts[p.status]++; });
  return {people, posts};
}
function esc(s){ return String(s??"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
function isRequestNote(note){
  const n=String(note||"").trim();
  if(!n) return false;
  if(/닉네임 카페|카페 닉|카페 원문/.test(n)) return false;
  return true;
}
function cardHtml(g){
  const req=isRequestNote(g.note)?" request":"";
  const posts=g.posts.map(p=>`
    <div class="post" data-id="${esc(p.id)}">
      <div class="title" contenteditable="true" data-f="title">${esc(p.title)}</div>
      <div class="meta">
        <input class="date" readonly tabindex="-1" value="${esc(p.date)}" placeholder="작성일">
        <input class="views" readonly tabindex="-1" value="${p.views!==""&&p.views!=null?("조회 "+esc(p.views)):""}" placeholder="조회수">
        <input class="likes" readonly tabindex="-1" value="${p.likes!==""&&p.likes!=null?("좋아요 "+esc(p.likes)):""}" placeholder="좋아요">
        <input class="link" readonly tabindex="-1" value="${esc(p.link)}" placeholder="링크">
        ${p.link?`<a class="btn-tiny btn-ghost" href="${esc(p.link)}" target="_blank" rel="noopener">열기</a>`:""}
        <button class="btn-tiny btn-danger del-post">글 삭제</button>
      </div>
    </div>`).join("");
  return `<div class="card" data-author="${esc(g.author)}" data-status="${esc(g.status)}">
    <div class="card-head">
      <input class="nick" data-f="author" value="${esc(g.author)}" placeholder="닉네임">
      <select class="status">${STATUSES.map(s=>`<option ${s===g.status?"selected":""}>${s}</option>`).join("")}</select>
      <span class="pill ${META[g.status].cls}" style="padding:3px 8px;font-size:11px;">${g.posts.length}편</span>
      <button class="btn-tiny btn-ghost add-post">+ 글</button>
      <button class="btn-tiny btn-danger del-person">사람 삭제</button>
    </div>
    ${g.note && String(g.note).trim() ? `<input class="note${req}" data-f="note" readonly tabindex="-1" value="${esc(g.note)}">` : ""}
    ${posts}
  </div>`;
}
function estimatePages(){
  const items=data.filter(p=>p.status==="동의완료");
  if(!items.length) return 0;
  const AVG=1580;
  let chars=0;
  items.forEach(p=>{ const h=Number(p.hangul); chars += h>0 ? h : AVG; });
  return Math.round(12 + chars/550 + items.length*0.7);
}
function render(){
  const c=counts();
  document.getElementById("pills").innerHTML =
    `<span class="pill ok">동의완료 ${c.people["동의완료"].size}명 ${c.posts["동의완료"]}편</span>`+
    `<span class="pill wait">답변 대기 ${c.people["답변 대기중"].size}명 ${c.posts["답변 대기중"]}편</span>`+
    `<span class="pill no">동의불가 ${c.people["동의불가"].size}명 ${c.posts["동의불가"]}편</span>`;
  const groups=grouped();
  const by={"동의완료":[],"답변 대기중":[],"동의불가":[]};
  groups.forEach(g=>by[g.status]&&by[g.status].push(g));
  STATUSES.forEach(st=>{
    by[st].sort((a,b)=>{
      const sa=(Number(a.movedAt)||0) || (PIN_TOP[a.author]||0);
      const sb=(Number(b.movedAt)||0) || (PIN_TOP[b.author]||0);
      return sb-sa || (a.idx||0)-(b.idx||0);
    });
  });
  document.getElementById("app").innerHTML = STATUSES.map(st=>{
    const list=by[st];
    const cards=list.length?list.map(cardHtml).join(""):`<div class="empty">아직 없습니다. 위에서 사람을 추가하세요.</div>`;
    return `<section class="section ${META[st].cls}">
      <div class="section-title">${st}<span class="count">${list.length}명 · ${list.reduce((n,g)=>n+g.posts.length,0)}편</span></div>
      <div class="section-sub">${st==="동의완료" ? ("현 상태로 출간하면 약 "+estimatePages()+"쪽 분량이 나옵니다") : META[st].sub}</div>${cards}</section>`;
  }).join("");
  bind();
}
function applyMeta(item, meta){
  if(!meta||!meta.ok) return item;
  item.id = meta.id || item.id;
  if(meta.title) item.title = item.title || meta.title;
  item.date = meta.date || item.date || "";
  item.views = meta.views!==undefined&&meta.views!==null ? meta.views : (item.views||"");
  item.likes = meta.likes!==undefined&&meta.likes!==null&&meta.likes!=="" ? meta.likes : (item.likes||"");
  item.link = meta.link || item.link || "";
  if(meta.hangul) item.hangul = meta.hangul;
  return item;
}
function bind(){
  document.querySelectorAll(".card").forEach(card=>{
    const author0=card.dataset.author, status0=card.dataset.status;
    const nick=card.querySelector(".nick"), statusSel=card.querySelector(".status"), note=card.querySelector(".note");
    nick.addEventListener("change", ()=>{
      const neu=nick.value.trim()||author0;
      data.forEach(p=>{ if(p.author===author0&&p.status===status0) p.author=neu; });
      save(); render();
    });
    statusSel.addEventListener("change", async ()=>{
      const neu=statusSel.value;
      if(neu===status0) return;
      statusSel.value=status0;
      const ok=await askConfirm("정말 수정하시겠습니까?");
      if(!ok) return;
      data.forEach(p=>{ if(p.author===author0&&p.status===status0){ p.status=neu; p.movedAt=Date.now(); } });
      orderRecent(data); save(); render();
    });
    if(note){
      note.addEventListener("change", ()=>{
        data.forEach(p=>{ if(p.author===author0&&p.status===status0) p.note=note.value; });
        save(); render();
      });
    }
    card.querySelectorAll(".post").forEach(row=>{
      const id=row.dataset.id;
      const titleInp=row.querySelector(".title");
      titleInp.addEventListener("blur", async ()=>{
        const item=data.find(p=>String(p.id)===String(id));
        if(!item) return;
        item.title=(titleInp.textContent||"").trim();
        save();
        setSaved("카페에서 찾는 중…");
        const meta=await cafeLookup(item.author, item.title);
        if(meta.ok){ applyMeta(item, meta); save(); render(); setSaved("카페 정보를 채웠습니다"); }
        else { setSaved(meta.error||"저장됨"); }
      });
      row.querySelector(".del-post").addEventListener("click", async ()=>{
        if(!await askConfirm("정말 삭제하시겠습니까?")) return;
        data=data.filter(p=>String(p.id)!==String(id));
        save(); render();
      });
    });
    card.querySelector(".add-post").addEventListener("click", async ()=>{
      const title=prompt("추가할 글 제목");
      if(title===null) return;
      const t=title.trim();
      if(!t) return;
      setSaved("카페에서 찾는 중…");
      const meta=await cafeLookup(author0, t);
      const item={id:uid(), status:status0, author:author0, note:note?note.value:(data.find(p=>p.author===author0&&p.status===status0)||{}).note||"", title:t, date:"", likes:"", views:"", link:""};
      if(meta.ok) applyMeta(item, meta);
      else setSaved(meta.error||"글을 추가했지만 카페 링크는 못 찾았습니다");
      data.push(item); save(); render();
      if(meta.ok) setSaved("카페 정보를 채웠습니다");
    });
    card.querySelector(".del-person").addEventListener("click", async ()=>{
      if(!await askConfirm("정말 삭제하시겠습니까?")) return;
      data=data.filter(p=>!(p.author===author0&&p.status===status0));
      save(); render();
    });
  });
}
document.getElementById("addPerson").onclick=()=>{ document.getElementById("modal").classList.add("show"); document.getElementById("m-msg").textContent=""; document.getElementById("m-author").focus(); };
document.getElementById("m-cancel").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("modal").addEventListener("click", e=>{ if(e.target.id==="modal") e.target.classList.remove("show"); });
document.getElementById("m-ok").onclick=async ()=>{
  const author=document.getElementById("m-author").value.trim();
  const title=document.getElementById("m-title").value.trim();
  const msg=document.getElementById("m-msg");
  if(!author||!title){ alert("닉네임과 글 제목을 적어 주세요."); return; }
  msg.textContent="카페에서 찾는 중…";
  document.getElementById("m-ok").disabled=true;
  const meta=await cafeLookup(author, title);
  const item={id:uid(), status:document.getElementById("m-status").value, author, note:document.getElementById("m-note").value.trim(), title, date:"", likes:"", views:"", link:"", movedAt:Date.now()};
  if(meta.ok) applyMeta(item, meta);
  data.push(item); save(); render();
  document.getElementById("m-ok").disabled=false;
  document.getElementById("m-author").value="";
  document.getElementById("m-title").value="";
  document.getElementById("m-note").value="";
  document.getElementById("modal").classList.remove("show");
  setSaved(meta.ok ? "카페 정보를 채웠습니다" : (meta.error||"추가했습니다"));
};
document.getElementById("syncBtn").onclick=async ()=>{
  if(!await askConfirm("폰에 저장된 예전 목록을 지우고, 지금 서버에 올라온 동의 현황으로 맞출까요?")) return;
  localStorage.removeItem(KEY);
  localStorage.removeItem("salmosa-consent-v1");
  localStorage.removeItem("salmosa-seed-rev");
  localStorage.removeItem("salmosa-consent-mig-20260822a");
  data=JSON.parse(JSON.stringify(SEED)).map(x=>{ if(!x.id) x.id=uid(); if(x.views==null) x.views=""; return x; });
  save(); render();
  setSaved("서버 목록으로 맞췄습니다");
};
document.getElementById("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="살모사_책_동의현황.json"; a.click(); URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      if(!Array.isArray(parsed)) throw new Error("배열이 아닙니다");
      data=parsed.map(p=>({id:p.id||uid(), status:STATUSES.includes(p.status)?p.status:"답변 대기중", author:p.author||"", note:p.note||"", title:p.title||"", date:p.date||"", likes:p.likes??"", views:p.views??"", hangul:p.hangul||"", link:p.link||""}));
      save(); render();
    }catch(err){ alert("JSON을 읽지 못했습니다."); }
  };
  reader.readAsText(f); e.target.value="";
};
document.getElementById("ask-yes").onclick=()=>{ if(askResolve) askResolve(true); };
document.getElementById("ask-no").onclick=()=>{ if(askResolve) askResolve(false); };
document.getElementById("ask").addEventListener("click", e=>{ if(e.target.id==="ask" && askResolve) askResolve(false); });
render(); save();
</script>
